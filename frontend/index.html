<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context-Aware AI Eraser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <h1>Context-Aware <span class="gradient-text">AI Eraser</span></h1>
            <p class="subtitle">Intelligent privacy protection for your visual content.</p>
        </header>

        <main>
            <div class="glass-panel upload-section">
                <div class="upload-area" id="drop-zone">
                    <div class="icon-container">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 16L12 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M9 11L12 8 15 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M8 16H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path
                                d="M3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12Z"
                                stroke="currentColor" stroke-width="2" />
                        </svg>
                    </div>
                    <h3>Upload an Image</h3>
                    <p>Drag & drop or click to browse</p>
                    <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" hidden>
                </div>

                <div class="controls">
                    <label class="toggle-label">Anonymization Context</label>
                    <div class="toggle-switch">
                        <input type="radio" name="context" id="public" value="public" checked>
                        <label for="public">Public</label>
                        <input type="radio" name="context" id="private" value="private">
                        <label for="private">Private</label>
                        <div class="slider"></div>
                    </div>
                    <div class="context-desc">
                        <span id="public-desc" class="active">Blur plates & IDs. Preserve faces.</span>
                        <span id="private-desc">Aggressively erase/blur all sensitive data.</span>
                    </div>
                    <button id="process-btn" class="primary-btn" disabled>
                        <span>Process Image</span>
                    </button>
                </div>
            </div>

            <div class="glass-panel results-section hidden" id="results-section">
                <div class="result-card">
                    <h4>Original</h4>
                    <div class="image-wrapper">
                        <img id="original-preview" src="" alt="Original">
                    </div>
                </div>
                <div class="result-card">
                    <h4>Protected</h4>
                    <div class="image-wrapper">
                        <img id="processed-preview" src="" alt="Protected">
                        <div class="loader-overlay hidden" id="loader">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by YOLOv8 & Context-Aware Privacy Engine</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
